<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Aluminum Outer Shell Gradients -->
    <linearGradient id="openShellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dde1dc" />
      <stop offset="50%" stop-color="#c1c7bf" />
      <stop offset="100%" stop-color="#9ea69d" />
    </linearGradient>

    <!-- Charcoal Microfiber Interior -->
    <linearGradient id="microfiber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a302b" />
      <stop offset="100%" stop-color="#181d19" />
    </linearGradient>

    <!-- Natural Solid Beechwood Tray -->
    <linearGradient id="beechWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbb494" />
      <stop offset="25%" stop-color="#d6c2a4" />
      <stop offset="50%" stop-color="#c5ae8e" />
      <stop offset="75%" stop-color="#dfceb4" />
      <stop offset="100%" stop-color="#c4ad8d" />
    </linearGradient>

    <linearGradient id="platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e8ebe8" />
      <stop offset="70%" stop-color="#b6bdb5" />
      <stop offset="100%" stop-color="#8c948b" />
    </linearGradient>

    <filter id="trayShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.38" />
    </filter>

    <filter id="pencilShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Floor Ambient Shadow -->
  <ellipse cx="450" cy="590" rx="380" ry="24" fill="#000000" opacity="0.16" />

  <!-- Lower Case Bed (Open Case Bottom Half) -->
  <rect x="90" y="240" width="720" height="340" rx="20" fill="url(#openShellGrad)" stroke="#778076" stroke-width="2" />
  <!-- Interior Lining Wall -->
  <rect x="100" y="250" width="700" height="320" rx="14" fill="url(#microfiber)" stroke="#3f4840" stroke-width="2" />

  <!-- Upper Lid (Held at 95° Angle by Stay Hinges) -->
  <g opacity="0.95">
    <path d="M100 240 L140 70 L760 70 L800 240 Z" fill="url(#openShellGrad)" stroke="#6b736a" stroke-width="2" />
    <!-- Lid Interior Microfiber Inset -->
    <path d="M115 232 L150 82 L750 82 L785 232 Z" fill="url(#microfiber)" />
    <!-- Lid Ribbing & Pouch Holder -->
    <line x1="200" y1="120" x2="700" y2="120" stroke="#485249" stroke-width="2" />
    <line x1="200" y1="170" x2="700" y2="170" stroke="#485249" stroke-width="2" />
    <rect x="350" y="110" width="200" height="70" rx="6" fill="#1f2621" stroke="#364038" stroke-width="1.5" />
    <text x="450" y="145" fill="#a4b0a2" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="4">OVIA ATELIER</text>
    <text x="450" y="162" fill="#717d6f" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" letter-spacing="2">EDITION 97390043 · TWO-TIER SYSTEM</text>

    <!-- Chrome Stay Hinges on Sides -->
    <line x1="108" y1="240" x2="148" y2="130" stroke="url(#platinum)" stroke-width="5" stroke-linecap="round" />
    <circle cx="108" cy="240" r="4" fill="#333" />
    <circle cx="148" cy="130" r="4" fill="#333" />

    <line x1="792" y1="240" x2="752" y2="130" stroke="url(#platinum)" stroke-width="5" stroke-linecap="round" />
    <circle cx="792" cy="240" r="4" fill="#333" />
    <circle cx="752" cy="130" r="4" fill="#333" />
  </g>

  <!-- TWO-TIERED SOLID BEECHWOOD ORGANIZER TRAY (Main Lower Compartment) -->
  <g filter="url(#trayShadow)">
    <!-- Main Solid Beechwood Outer Frame -->
    <rect x="120" y="270" width="660" height="280" rx="10" fill="url(#beechWood)" stroke="#9c8466" stroke-width="2" />
    
    <!-- Tray Inset Bed with Precision Fluted Grooves -->
    <rect x="132" y="282" width="636" height="190" rx="6" fill="#1b211d" />

    <!-- 120 POLYCHROMOS ARTIST PENCILS (Visualized in stunning spectrum) -->
    <!-- Pencil tips on top, barrels running down -->
    <!-- We generate 36 detailed hero pencils spanning the full color wheel -->
    <!-- Yellows to Oranges -->
    <g filter="url(#pencilShadow)">
      <!-- Lemon Yellow -->
      <rect x="142" y="295" width="8" height="165" rx="2" fill="#fff133" />
      <polygon points="142,295 146,285 150,295" fill="#f4ebd9" />
      <polygon points="144,289 146,285 148,289" fill="#fff133" />

      <!-- Cadmium Yellow -->
      <rect x="156" y="295" width="8" height="165" rx="2" fill="#ffd100" />
      <polygon points="156,295 160,285 164,295" fill="#f4ebd9" />
      <polygon points="158,289 160,285 162,289" fill="#ffd100" />

      <!-- Deep Orange -->
      <rect x="170" y="295" width="8" height="165" rx="2" fill="#ff7900" />
      <polygon points="170,295 174,285 178,295" fill="#f4ebd9" />
      <polygon points="172,289 174,285 176,289" fill="#ff7900" />

      <!-- Scarlet Vermilion -->
      <rect x="184" y="295" width="8" height="165" rx="2" fill="#e82c0c" />
      <polygon points="184,295 188,285 192,295" fill="#f4ebd9" />
      <polygon points="186,289 188,285 190,289" fill="#e82c0c" />

      <!-- Crimson Red -->
      <rect x="198" y="295" width="8" height="165" rx="2" fill="#b80c29" />
      <polygon points="198,295 202,285 206,295" fill="#f4ebd9" />
      <polygon points="200,289 202,285 204,289" fill="#b80c29" />

      <!-- Magenta Pink -->
      <rect x="212" y="295" width="8" height="165" rx="2" fill="#d1267b" />
      <polygon points="212,295 216,285 220,295" fill="#f4ebd9" />
      <polygon points="214,289 216,285 218,289" fill="#d1267b" />

      <!-- Purple Violet -->
      <rect x="226" y="295" width="8" height="165" rx="2" fill="#7a2182" />
      <polygon points="226,295 230,285 234,295" fill="#f4ebd9" />
      <polygon points="228,289 230,285 232,289" fill="#7a2182" />

      <!-- Ultramarine Blue -->
      <rect x="240" y="295" width="8" height="165" rx="2" fill="#243cb0" />
      <polygon points="240,295 244,285 248,295" fill="#f4ebd9" />
      <polygon points="242,289 244,285 246,289" fill="#243cb0" />

      <!-- Cobalt Blue -->
      <rect x="254" y="295" width="8" height="165" rx="2" fill="#1464c2" />
      <polygon points="254,295 258,285 262,295" fill="#f4ebd9" />
      <polygon points="256,289 258,285 260,289" fill="#1464c2" />

      <!-- Cerulean Cyan -->
      <rect x="268" y="295" width="8" height="165" rx="2" fill="#0096c7" />
      <polygon points="268,295 272,285 276,295" fill="#f4ebd9" />
      <polygon points="270,289 272,285 274,289" fill="#0096c7" />

      <!-- Turquoise -->
      <rect x="282" y="295" width="8" height="165" rx="2" fill="#00a896" />
      <polygon points="282,295 286,285 290,295" fill="#f4ebd9" />
      <polygon points="284,289 286,285 288,289" fill="#00a896" />

      <!-- Emerald Green -->
      <rect x="296" y="295" width="8" height="165" rx="2" fill="#107e4a" />
      <polygon points="296,295 300,285 304,295" fill="#f4ebd9" />
      <polygon points="298,289 300,285 302,289" fill="#107e4a" />

      <!-- Faber-Castell Heritage Green -->
      <rect x="310" y="295" width="8" height="165" rx="2" fill="#1a4d2e" />
      <polygon points="310,295 314,285 318,295" fill="#f4ebd9" />
      <polygon points="312,289 314,285 316,289" fill="#1a4d2e" />

      <!-- Forest Olive -->
      <rect x="324" y="295" width="8" height="165" rx="2" fill="#52643a" />
      <polygon points="324,295 328,285 332,295" fill="#f4ebd9" />
      <polygon points="326,289 328,285 330,289" fill="#52643a" />

      <!-- Ochre Gold -->
      <rect x="338" y="295" width="8" height="165" rx="2" fill="#c7923e" />
      <polygon points="338,295 342,285 346,295" fill="#f4ebd9" />
      <polygon points="340,289 342,285 344,289" fill="#c7923e" />

      <!-- Burnt Sienna -->
      <rect x="352" y="295" width="8" height="165" rx="2" fill="#8c4722" />
      <polygon points="352,295 356,285 360,295" fill="#f4ebd9" />
      <polygon points="354,289 356,285 358,289" fill="#8c4722" />

      <!-- Raw Umber -->
      <rect x="366" y="295" width="8" height="165" rx="2" fill="#543729" />
      <polygon points="366,295 370,285 374,295" fill="#f4ebd9" />
      <polygon points="368,289 370,285 372,289" fill="#543729" />

      <!-- Warm Grey -->
      <rect x="380" y="295" width="8" height="165" rx="2" fill="#8a8a86" />
      <polygon points="380,295 384,285 388,295" fill="#f4ebd9" />
      <polygon points="382,289 384,285 386,289" fill="#8a8a86" />

      <!-- Slate Black -->
      <rect x="394" y="295" width="8" height="165" rx="2" fill="#2b2d2f" />
      <polygon points="394,295 398,285 402,295" fill="#f4ebd9" />
      <polygon points="396,289 398,285 400,289" fill="#2b2d2f" />
      
      <!-- Spectrum continuation (Second half array) -->
      <rect x="408" y="295" width="8" height="165" rx="2" fill="#ffd100" />
      <polygon points="408,295 412,285 416,295" fill="#f4ebd9" /><polygon points="410,289 412,285 414,289" fill="#ffd100" />

      <rect x="422" y="295" width="8" height="165" rx="2" fill="#f58220" />
      <polygon points="422,295 426,285 430,295" fill="#f4ebd9" /><polygon points="424,289 426,285 428,289" fill="#f58220" />

      <rect x="436" y="295" width="8" height="165" rx="2" fill="#e61c24" />
      <polygon points="436,295 440,285 444,295" fill="#f4ebd9" /><polygon points="438,289 440,285 442,289" fill="#e61c24" />

      <rect x="450" y="295" width="8" height="165" rx="2" fill="#9b2680" />
      <polygon points="450,295 454,285 458,295" fill="#f4ebd9" /><polygon points="452,289 454,285 456,289" fill="#9b2680" />

      <rect x="464" y="295" width="8" height="165" rx="2" fill="#462c82" />
      <polygon points="464,295 468,285 472,295" fill="#f4ebd9" /><polygon points="466,289 468,285 470,289" fill="#462c82" />

      <rect x="478" y="295" width="8" height="165" rx="2" fill="#1b499c" />
      <polygon points="478,295 482,285 486,295" fill="#f4ebd9" /><polygon points="480,289 482,285 484,289" fill="#1b499c" />

      <rect x="492" y="295" width="8" height="165" rx="2" fill="#0072bc" />
      <polygon points="492,295 496,285 500,295" fill="#f4ebd9" /><polygon points="494,289 496,285 498,289" fill="#0072bc" />

      <rect x="506" y="295" width="8" height="165" rx="2" fill="#00a550" />
      <polygon points="506,295 510,285 514,295" fill="#f4ebd9" /><polygon points="508,289 510,285 512,289" fill="#00a550" />

      <rect x="520" y="295" width="8" height="165" rx="2" fill="#005826" />
      <polygon points="520,295 524,285 528,295" fill="#f4ebd9" /><polygon points="522,289 524,285 526,289" fill="#005826" />

      <!-- 2B Graphite Pencils (Matte Dark Green with Platinum Foil) -->
      <rect x="534" y="295" width="8" height="165" rx="2" fill="#1b3827" />
      <polygon points="534,295 538,285 542,295" fill="#c4ad8d" /><polygon points="536,289 538,285 540,289" fill="#2c2c2c" />

      <rect x="548" y="295" width="8" height="165" rx="2" fill="#1b3827" />
      <polygon points="548,295 552,285 556,295" fill="#c4ad8d" /><polygon points="550,289 552,285 554,289" fill="#2c2c2c" />

      <rect x="562" y="295" width="8" height="165" rx="2" fill="#1b3827" />
      <polygon points="562,295 566,285 570,295" fill="#c4ad8d" /><polygon points="564,289 566,285 568,289" fill="#2c2c2c" />
    </g>

    <!-- Right Side: Platinum Accessories Inset Compartment -->
    <rect x="590" y="285" width="170" height="184" rx="6" fill="#171c18" stroke="#353e37" stroke-width="1.5" />
    
    <!-- Platinum Double Sharpener -->
    <rect x="610" y="305" width="55" height="70" rx="6" fill="url(#platinum)" stroke="#525c53" stroke-width="1.5" />
    <circle cx="628" cy="325" r="7" fill="#1c211d" />
    <circle cx="647" cy="325" r="5" fill="#1c211d" />
    <text x="637" y="360" fill="#303831" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">OVIA</text>

    <!-- Cylindrical Platinum Replaceable Eraser -->
    <rect x="685" y="305" width="55" height="70" rx="8" fill="#e8ebe6" stroke="#9da69c" stroke-width="1" />
    <rect x="685" y="335" width="55" height="15" fill="url(#platinum)" stroke="#667065" stroke-width="1" />
    <text x="712" y="346" fill="#1e241f" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">ERASER</text>

    <!-- Certificate & Manual Compartment Below Tools -->
    <rect x="605" y="395" width="140" height="60" rx="4" fill="#2a332c" stroke="#48574a" stroke-width="1" />
    <text x="675" y="420" fill="#c1cdc0" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle">MANUAL &amp; GUIDE</text>
    <text x="675" y="435" fill="#7d8f7b" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">COLOR TECHNIQUES</text>

    <!-- Bottom Tray Title & Specs Inscription -->
    <rect x="132" y="482" width="636" height="58" rx="6" fill="#222b24" />
    <text x="155" y="516" fill="#d2ded0" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1">120 POLYCHROMOS ARTIST PENCILS · CUSTOM 2B GRAPHITE</text>
    <text x="750" y="516" fill="#889886" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" letter-spacing="2">DUAL-TIER SOLID BEECHWOOD</text>
  </g>

  <!-- Bottom Annotation -->
  <text x="450" y="626" fill="#586156" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="4">
    STUDIO ATELIER INTERIOR · REMOVABLE WOODEN TRAYS · PLATINUM FINISH ACCESSORIES
  </text>
</svg>
